# This is a basic workflow to help you get started with Actions

name: Comunicador de la legión


on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Qué villano envía el mensaje?"
        required: true
        type: choice
        options:
          - "Brainiac"
          - "Lex Luthor"
          - "Darkseid"

      mensaje:
        description: "Mensaje a transmitir"
        required: true
        default: "La misión fue un éxito"
     
      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - "Alta"
          - "Media"
          - "Baja"

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Imprimir inputs
        run: |
          echo "Villano: ${{ inputs.villano }}"
          echo "Mensaje: ${{ inputs.mensaje }}"
          echo "Prioridad: ${{ inputs.prioridad }}"